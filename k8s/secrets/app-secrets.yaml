# Dev-only secret values. In production these would be sourced from
# Vault / AWS Secrets Manager / GCP Secret Manager via the External Secrets
# Operator, with the Secret resource itself synthesized rather than committed.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ledgerlite
type: Opaque
stringData:
  JWT_SECRET: super-secret-dev-key-that-is-at-least-256-bits-long-for-hs256
  POSTGRES_PASSWORD: ledgerlite
