server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:ledgerlite}
    password: ${SPRING_DATASOURCE_PASSWORD:ledgerlite}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers,env
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0  # ~0.1 in prod
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411}/api/v2/spans

ledgerlite:
  jwt:
    secret: ${JWT_SECRET:super-secret-dev-key-that-is-at-least-256-bits-long-for-hs256}
    ttl: ${JWT_TTL:3600000}
    issuer: ${JWT_ISSUER:ledgerlite}
